<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#313244"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#cba6f7"/>
      <stop offset="50%" style="stop-color:#89b4fa"/>
      <stop offset="100%" style="stop-color:#74c7ec"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="96" height="96" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Visible border — separates icon from dark Dock background -->
  <rect x="1.5" y="1.5" width="93" height="93" rx="21" ry="21"
        fill="none" stroke="#585b70" stroke-width="1.5"/>

  <!-- Lightning bolt — centred, slightly inset -->
  <polygon
    points="54,10 30,52 48,52 42,86 66,44 48,44"
    fill="url(#bolt)"
    filter="url(#glow)"
  />
</svg>
