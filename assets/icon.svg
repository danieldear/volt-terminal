<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#313244"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>

    <linearGradient id="bolt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   style="stop-color:#cba6f7"/>
      <stop offset="50%"  style="stop-color:#89b4fa"/>
      <stop offset="100%" style="stop-color:#74c7ec"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!--
      Apple HIG squircle: rx = 22.4% of 1024 = 230px.
      This matches the corner curvature macOS uses for all app icons.
      Previous value (185) was too small, making corners look rectangular.
    -->
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- Everything clipped to the Apple-spec squircle -->
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!--
      Bolt: same original proportions (natural lean) scaled to fill ~70%
      of safe zone. Inner shadow line for subtle depth.
    -->
    <polygon
      points="594,155  265,555  512,555  430,870  759,470  512,470"
      fill="url(#bolt)"
      filter="url(#glow)"
    />

    <!-- Subtle inner edge: a semi-transparent highlight at the top -->
    <rect width="1024" height="512" fill="url(#topshine)" opacity="0.04"/>
  </g>
</svg>
