<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#313244"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>

    <linearGradient id="bolt" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"   style="stop-color:#cba6f7"/>
      <stop offset="50%"  style="stop-color:#89b4fa"/>
      <stop offset="100%" style="stop-color:#74c7ec"/>
    </linearGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Apple HIG squircle: 1024x1024 canvas, rx≈185 -->
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!--
      Same proportions as original bolt (which looked good) but scaled to
      fill ~60% width × 87% height of safe zone (100–924px each axis).
      Horizontal lean: 164px over 715px — natural, not excessive.
    -->
    <polygon
      points="594,155  265,555  512,555  430,870  759,470  512,470"
      fill="url(#bolt)"
      filter="url(#glow)"
    />
  </g>

  <!-- Visible border -->
  <rect x="14" y="14" width="996" height="996" rx="178" ry="178"
        fill="none" stroke="#585b70" stroke-width="16"/>
</svg>
