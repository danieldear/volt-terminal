[workspace]
members = ["volt-config", "volt-core", "volt-renderer", "volt-ui", "volt"]
resolver = "2"

[workspace.package]
version = "0.1.12"
edition = "2021"
rust-version = "1.87"

[workspace.dependencies]
tokio = { version = "1" }
serde = { version = "1", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package.volt-core]
opt-level = 2

[profile.dev.package.volt-renderer]
opt-level = 2
