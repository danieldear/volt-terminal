name: Dependency audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}" \
            -o "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
      - name: Scan all reachable Git history
        shell: bash
        run: ./gitleaks git --log-opts='--all' --redact=100 --no-banner .

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cargo-audit
      - run: cargo install cargo-audit --version 0.22.2 --locked
      # Vulnerabilities, unsoundness and yanked packages fail the job. Informational unmaintained warnings remain
      # visible; any future exception must be documented and time-bounded.
      - run: cargo audit --deny unsound --deny yanked
