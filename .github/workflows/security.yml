name: Dependency audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cargo-audit
      - run: cargo install cargo-audit --version 0.22.2 --locked
      # Vulnerabilities, unsoundness and yanked packages fail the job. Informational unmaintained warnings remain
      # visible; any future exception must be documented and time-bounded.
      - run: cargo audit --deny unsound --deny yanked
