name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy opt-in GPU Settings prototype
        if: matrix.os == 'macos-latest'
        run: cargo clippy --locked -p volt -p volt-ui -p volt-renderer --all-targets --features volt/ui-gpu-prototype -- -D warnings

  test:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            fonts-dejavu-core \
            mesa-vulkan-drivers
      # UI Kit 0.4's deep-tree rejection fixture needs larger test stacks only.
      - run: RUST_MIN_STACK=33554432 cargo test --locked --workspace
      - name: Test opt-in GPU Settings prototype
        if: matrix.os == 'macos-latest'
        # Native toolkit font-alias tests belong to its upstream CI. This host
        # imports Volt-shaped glyphs, not the toolkit's native text shaper.
        # The full default workspace suite above still tests the pinned toolkit.
        run: |
          RUST_MIN_STACK=33554432 cargo test --locked -p volt -p volt-ui -p volt-renderer --features volt/ui-gpu-prototype
          cargo run --locked -p volt-renderer --example settingsgpucheck --features ui-gpu-prototype
      - name: Validation script unit tests
        run: python3 -m unittest discover -s scripts/validation -p 'test_*.py'
      - name: Offscreen GPU renderer regressions (Mesa software Vulkan)
        if: matrix.os == 'ubuntu-latest'
        env:
          XDG_RUNTIME_DIR: /tmp
        run: |
          cargo run --locked -p volt-renderer --example rendercheck -- target/rendercheck --fixtures-only
          cargo run --locked -p volt-renderer --example cardcheck
          cargo run --locked -p volt-renderer --example searchcheck
          cargo run --locked -p volt-renderer --example themecheck
          cargo run --locked -p volt-renderer --example tabcheck
          cargo run --locked -p volt-renderer --example taskcheck
          cargo run --locked -p volt-renderer --example settingscheck
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: rendering-fixtures-linux
          path: |
            target/rendercheck
            target/cardcheck
            target/searchcheck
            target/themecheck
            target/tabcheck
            target/settingscheck
          if-no-files-found: warn

  msrv:
    name: Rust 1.89 MSRV
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      - run: cargo check --locked --workspace --all-targets
      - name: Check opt-in GPU Settings prototype MSRV
        run: cargo check --locked --workspace --all-targets --features volt/ui-gpu-prototype
      - run: cargo test --locked -p volt-core -p volt-config
